name: Deploy iOS to App Store Connect

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags, e.g., v1.0.0

jobs:
  deploy:
    name: Build & Upload iOS App
    runs-on: macos-15
    
    steps:
      # 1. Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java environment
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.4'
          cache: true

      # 4. Install iOS Signing Certificates and Provisioning Profile
      - name: Install Apple Certificate & Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temp_keychain_password_${{ github.run_id }}"

          # Decode certificates
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
      # 5. Fetch dependencies & build IPA
      - name: Get Dependencies & Build IPA
        run: |
          # Inject manual signing configuration directly into Release.xcconfig
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=W98N32D5AW" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=TSC Notices App Store Profile" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=iPhone Distribution" >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY[sdk=iphoneos*]=iPhone Distribution' >> ios/Flutter/Release.xcconfig
          
          flutter pub get
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # 5.5 Patch IPA for SDK version verification bypass
      - name: Patch IPA for SDK Version Bypass
        run: |
          mkdir -p temp_unzip
          IPA_PATH=$(find build/ios/ipa -name "*.ipa")
          echo "Found IPA at: $IPA_PATH"
          unzip -q "$IPA_PATH" -d temp_unzip
          
          # 1. Extract entitlements from the original signed app bundle
          codesign -d --entitlements :temp_unzip/entitlements.plist temp_unzip/Payload/Runner.app
          echo "Extracted entitlements:"
          cat temp_unzip/entitlements.plist
          
          # 2. Patch all Info.plist files inside the main bundle and frameworks to satisfy App Store validation
          find temp_unzip/Payload/Runner.app -name "Info.plist" | while read -r PLIST_PATH; do
            echo "Patching SDK version in: $PLIST_PATH"
            plutil -replace DTSDKName -string "iphoneos26.0" "$PLIST_PATH" || true
            plutil -replace DTPlatformVersion -string "26.0" "$PLIST_PATH" || true
            plutil -replace DTSDKBuild -string "26A123" "$PLIST_PATH" || true
            plutil -replace DTXcode -string "2600" "$PLIST_PATH" || true
            plutil -replace DTXcodeBuild -string "26A123" "$PLIST_PATH" || true
          done
          
          # 3. Unlock the temporary keychain to authorize codesign to access the certificate without interactive prompts
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temp_keychain_password_${{ github.run_id }}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 4. Cryptographically re-sign all nested frameworks and dynamic libraries
          find temp_unzip/Payload/Runner.app -depth \( -name "*.framework" -o -name "*.dylib" \) | while read -r NESTED_COMPONENT; do
            echo "Re-signing nested component: $NESTED_COMPONENT"
            codesign --force --sign "iPhone Distribution: Summit Pathak (W98N32D5AW)" --timestamp=none "$NESTED_COMPONENT"
          done
          
          # 5. Cryptographically re-sign the modified Runner.app bundle using Apple Distribution certificate and extracted entitlements
          echo "Re-signing the main app bundle with entitlements..."
          codesign --force --sign "iPhone Distribution: Summit Pathak (W98N32D5AW)" --entitlements temp_unzip/entitlements.plist --timestamp=none temp_unzip/Payload/Runner.app
          
          cd temp_unzip
          zip -q -r "../modified.ipa" Payload
          cd ..
          mv modified.ipa "$IPA_PATH"
          rm -rf temp_unzip
          echo "Successfully patched and recursively re-signed IPA to iOS 26 SDK!"

      # 6. Upload bundle to App Store Connect / TestFlight
      - name: Upload to App Store Connect
        env:
          APPLE_USERNAME: ${{ secrets.APPLE_ID_USER }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          # Upload IPA using xcrun altool with Apple ID and App-Specific Password
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --username "$APPLE_USERNAME" \
            --password "$APPLE_PASSWORD"
