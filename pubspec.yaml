name: tsc_notices
description: "A premium Flutter mobile application to fetch, cache, search, and view notices, results, vacancies, and exam center details from TSC Nepal."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  google_mobile_ads: ^5.1.0

  # Network & Scraping
  http: ^1.2.0
  html: ^0.15.4

  # Utilities & Cache
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Icons
  cupertino_icons: ^1.0.6

  # Tracking & Compliance
  app_tracking_transparency: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
